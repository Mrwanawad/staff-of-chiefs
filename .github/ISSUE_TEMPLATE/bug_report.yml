name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. /staff-of-chiefs --plan ...\n2. ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node version (node --version), Claude Code version (claude --version), plugin or manual install"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Status line, dashboard feed, or the last lines of <config>/staff-of-chiefs/state/events.jsonl. Remove anything private.
      render: text
